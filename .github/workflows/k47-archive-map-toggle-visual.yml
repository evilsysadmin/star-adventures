name: K-47 archive plaque · compact desktop map toggle visual gate

on:
  pull_request:
    paths:
      - "frontend/src/components/gameShell.css"
      - "frontend/tests/k47ArchiveMapSwitchVisual.spec.ts"
      - ".github/workflows/k47-archive-map-toggle-visual.yml"

permissions:
  contents: read

jobs:
  archive-camera:
    name: Real K-47 archive walkthrough and before/after 390/1280/1757
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Reproduce genuine archive label, compare map-toggle bounds and ensure keyboard/touch
        run: npm run test:e2e --prefix frontend -- tests/k47ArchiveMapSwitchVisual.spec.ts
      - name: Preserve authentic before/after browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k47-archive-map-toggle-${{ github.sha }}
          path: |
            frontend/test-results/k47-archive-map-switch-*.png
          if-no-files-found: warn
          retention-days: 14
