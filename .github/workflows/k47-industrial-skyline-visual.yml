name: K-47 south skyline · painted architecture A/B

on:
  pull_request:
    paths:
      - "frontend/src/components/GroundIndustrialSkyline.tsx"
      - "frontend/src/components/GroundColonyArchitecture.tsx"
      - "frontend/tests/k47VisibleIndustrialSkyline.spec.ts"
      - ".github/workflows/k47-industrial-skyline-visual.yml"

permissions:
  contents: read

jobs:
  skyline-visual:
    name: Real K-47 visible skyline · 390/1280 A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Real surface and squad command + F5, before/after screenshots
        run: npm run test:e2e --prefix frontend -- tests/k47VisibleIndustrialSkyline.spec.ts
      - name: Upload screenshots for actual compositing visual gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k47-visible-industrial-skyline-${{ github.sha }}
          path: frontend/test-results/k47-skyline-*.png
          if-no-files-found: warn
          retention-days: 14
