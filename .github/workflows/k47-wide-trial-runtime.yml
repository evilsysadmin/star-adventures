name: K-47 wide mission · real playable 640-cell trial

on:
  pull_request:
    paths:
      - "content/scenes/k47-wide-plan.json"
      - "src/groundWideTrialSave.mjs"
      - "src/groundWideMission.mjs"
      - "tests/groundWideMission.test.mjs"
      - "frontend/tests/k47WideMissionRuntime.spec.ts"
      - "src/groundWideTerrainKit.mjs"
      - "src/groundWideStructures.mjs"
      - "tests/groundWideStructures.test.mjs"
      - "frontend/src/components/WideTerrainStructure.tsx"
      - "tests/groundWideTerrainKit.test.mjs"
      - "tests/groundWideStructures.test.mjs"
      - "frontend/src/components/GroundWideTerrainArt.tsx"
      - "tests/groundWideTrialSave.test.mjs"
      - "frontend/src/components/GroundWideTrial.tsx"
      - "frontend/src/components/groundWideTrial.css"
      - "frontend/src/components/GroundSquadSelection.tsx"
      - "frontend/src/components/FirstPersonView.tsx"
      - "frontend/tests/k47WideTrialRuntime.spec.ts"
      - ".github/workflows/k47-wide-trial-runtime.yml"

permissions:
  contents: read

jobs:
  wide-trial:
    name: Live 640-cell mission · 390/1280 relay, science branches, F5 and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove terrain topology, trial identity and motion save
        run: node --test tests/groundWideLayout.test.mjs tests/groundWideTrialSave.test.mjs tests/groundWideTerrainKit.test.mjs tests/groundWideStructures.test.mjs tests/groundWideMission.test.mjs
      - name: Install frontend
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Typecheck and bundle actual game
        run: npm run build --prefix frontend
      - name: Play the wide trial in real desktop and mobile Chromium
        run: npm run test:e2e --prefix frontend -- tests/k47WideTrialRuntime.spec.ts tests/k47WideMissionRuntime.spec.ts
      - name: Preserve real-play screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k47-wide-trial-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            frontend/test-results/k47-wide-real-*.png
            frontend/test-results/k47-wide-authored-*.png
            frontend/test-results/k47-wide-mission-*.png
