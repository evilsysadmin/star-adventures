name: K-47 unified architecture · full-sector visual gate

on:
  pull_request:
    paths:
      - "scripts/author_k47_archive.py"
      - "scripts/author_k47_east.py"
      - "scripts/author_k47_south.py"
      - "frontend/tests/k47SectorBundleVisual.spec.ts"
      - "frontend/src/components/groundSquadSelection.css"
      - ".github/workflows/k47-sector-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sector-art:
    name: Three original GLBs + real K-47 full-sector Chrome A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned original art dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 Pillow==12.0.0 trimesh==4.11.1
      - name: Generate all three original bounded GLB candidates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/author_k47_south.py frontend/tests/fixtures/k47-south-candidate.glb
          python scripts/author_k47_archive.py frontend/tests/fixtures/k47-archive-candidate.glb
          python scripts/author_k47_east.py frontend/tests/fixtures/k47-east-candidate.glb
      - name: Verify SHA-256, embedded GLB 2.0 and original provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          for stem,expected in [('south','south-industrial-shell'),('archive','west-archive-shell'),('east','east-utilities-shell')]:
              p=Path('frontend/tests/fixtures/k47-'+stem+'-candidate.glb')
              data=p.read_bytes();meta=json.loads(p.with_suffix('.json').read_text())
              magic,version,length=struct.unpack_from('<III',data)
              assert (magic,version,length)==(0x46546c67,2,len(data))
              n,kind=struct.unpack_from('<II',data,12)
              assert n%4==0 and kind==0x4e4f534a
              gltf=json.loads(data[20:20+n])
              assert gltf['asset']['version']=='2.0'
              assert not gltf.get('extensionsRequired')
              assert all('uri' not in x for x in gltf.get('buffers',[]))
              assert all('uri' not in x for x in gltf.get('images',[]))
              assert meta['sha256']==hashlib.sha256(data).hexdigest()
              assert meta['id']==expected and meta['license']=='original'
              assert meta['materials']>=8 and meta['authored_elements']>=75
              assert len(data)<=4*1024*1024
              print('VERIFIED_ORIGINAL_K47_MODEL',expected,len(data))
          PY
      - name: Install frontend
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Test complete actual landing mission with original multi-building art
        run: npm run test:e2e --prefix frontend -- tests/k47SectorBundleVisual.spec.ts
      - name: Upload actual before/after screenshots and original models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k47-three-building-sector-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            frontend/test-results/k47-full-sector-*.png
            frontend/tests/fixtures/k47-south-candidate.glb
            frontend/tests/fixtures/k47-south-candidate.json
            frontend/tests/fixtures/k47-archive-candidate.glb
            frontend/tests/fixtures/k47-archive-candidate.json
            frontend/tests/fixtures/k47-east-candidate.glb
            frontend/tests/fixtures/k47-east-candidate.json
