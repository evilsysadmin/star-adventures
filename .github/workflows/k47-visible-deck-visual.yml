name: K-47 visible courtyard material · actual game A/B

on:
  pull_request:
    paths:
      - "frontend/src/components/GroundRescueBayDeck.tsx"
      - "frontend/tests/k47VisibleBayWearVisual.spec.ts"
      - ".github/workflows/k47-visible-deck-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visible-wear:
    name: Original bay patina · 390/1280 real-scene before-after
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install game frontend
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Compare real playable bay with and without visible world-aligned wear
        run: npm run test:e2e --prefix frontend -- tests/k47VisibleBayWearVisual.spec.ts
      - name: Upload original and candidate browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k47-visible-deck-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: frontend/test-results/k47-visible-deck-*.png
