name: Star Adventures CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core rules and episode tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify rules, narrative and syntax
        run: npm run check

  web:
    name: React build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Verify runner-installed Chrome
        run: google-chrome --version
      - name: Tactical camera, grid and animation contracts
        run: npm run test:grid --prefix frontend
      - name: Typecheck and bundle
        run: npm run build --prefix frontend
      # Keep the original web check name for Infra admission. Each of the five
      # browser shards is mandatory; file assignment uses measured spec durations.
      # New specs receive a fallback weight and are assigned automatically.
      - name: Build deterministic K-47 west archive candidate (never deployed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/.k47-candidate
          python3 frontend/scripts/build_k47_west_facade.py > "$RUNNER_TEMP/k47-west.glb"
          sha="$(sha256sum "$RUNNER_TEMP/k47-west.glb" | cut -d' ' -f1)"
          bytes="$(wc -c < "$RUNNER_TEMP/k47-west.glb")"
          test "$bytes" -ge 100000 && test "$bytes" -le 4194304
          cp "$RUNNER_TEMP/k47-west.glb" "frontend/.k47-candidate/west-archive-shell-${sha:0:16}.glb"
          echo "K47_AUTHORED_CANDIDATE sha256=$sha bytes=$bytes"
      - name: Browser journey, keyboard and mobile widths (shard 1/5)
        run: node scripts/run-browser-shard.mjs 1/5
      - name: Upload reviewed candidate bytes for later Infra-controlled publication
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staradvs-k47-west-candidate-${{ github.sha }}
          path: frontend/.k47-candidate/west-archive-shell-*.glb
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser screenshots and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-adventures-react-visual-${{ github.sha }}
          path: |
            frontend/test-results/*.png
            frontend/package-lock.json
          if-no-files-found: warn
          retention-days: 7

  web-browser-rest:
    name: Remaining Chrome journeys (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report failures on every shard; do not cancel unrelated checks.
      fail-fast: false
      matrix:
        shard: [2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Verify runner-installed Chrome
        run: google-chrome --version
      - name: Browser journey, keyboard and mobile widths (shard ${{ matrix.shard }}/5)
        run: node scripts/run-browser-shard.mjs ${{ matrix.shard }}/5
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-adventures-react-visual-part${{ matrix.shard }}-${{ github.sha }}
          path: frontend/test-results/*.png
          if-no-files-found: warn
          retention-days: 7

  infra-staging-notification:
    name: Request Infra-owned staging sync
    needs: [core, web, web-browser-rest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/star-adventures'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify ShadowOps Infra without publishing from game repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SHADOWOPS_INFRA_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'STARADVS_INFRA_DISPATCH_NOT_CONFIGURED (Infra scheduled fallback remains active)'
            exit 0
          fi
          # This only requests the trusted Infra workflow; that workflow
          # independently checks exact main SHA and successful source CI.
          if gh api --method POST \
              repos/evilsysadmin/shadowops-infra/actions/workflows/staradvs-pages-staging.yml/dispatches \
              -f ref=main; then
            echo "STARADVS_INFRA_DISPATCH_ACCEPTED source_sha=$GITHUB_SHA"
          else
            echo '::warning::ShadowOps Infra dispatch unavailable; Infra scheduled fallback remains active'
          fi
