name: K-47 mounted industrial station signage · browser A/B

on:
  pull_request:
    paths:
      - "frontend/src/components/GroundColonyArchitecture.tsx"
      - "frontend/src/components/groundSquadSelection.css"
      - "frontend/tests/k47StationEnamelSignVisual.spec.ts"
      - ".github/workflows/k47-station-signage-visual.yml"

permissions:
  contents: read

jobs:
  industrial-station-wayfinding:
    name: True 390/1280 sign A/B · mission, real orders + F5
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Capture real K-47 signage, same-frame counterfactual and mission walk
        run: npm run test:e2e --prefix frontend -- tests/k47StationEnamelSignVisual.spec.ts
      - name: Preserve authentic Chromium 390/1280 artwork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k47-station-enamel-ab-${{ github.sha }}
          path: |
            frontend/test-results/k47-station-*.png
          if-no-files-found: warn
          retention-days: 14
