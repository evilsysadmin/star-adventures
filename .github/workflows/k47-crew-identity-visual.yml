name: K-47 officer nameplate hierarchy · real game A/B

on:
  pull_request:
    paths:
      - "frontend/src/components/GroundSquadSelection.tsx"
      - "frontend/src/components/groundSquadSelection.css"
      - "frontend/tests/k47CrewContextualIdentityVisual.spec.ts"
      - ".github/workflows/k47-crew-identity-visual.yml"

permissions:
  contents: read

jobs:
  crew-identity:
    name: Authentic 390/1280 callsign A/B · select/hover/F5
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Capture actual squad selection, all names and contextual identities
        run: npm run test:e2e --prefix frontend -- tests/k47CrewContextualIdentityVisual.spec.ts
      - name: Preserve real Chromium screenshots of crew identity A/B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k47-crew-contextual-identity-${{ github.sha }}
          path: |
            frontend/test-results/k47-crew-*.png
          if-no-files-found: warn
          retention-days: 14
