name: Star Adventures CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel obsolete revisions of the same PR, never a push to main.
  # Every main SHA must complete its independent CI checks for Infra admission.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core rules and episode tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify rules, narrative and syntax
        run: npm run check

  web:
    name: React build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Verify runner-installed Chrome
        run: google-chrome --version
      - name: Tactical camera, grid and animation contracts
        run: npm run test:grid --prefix frontend
      - name: Typecheck and bundle
        run: npm run build --prefix frontend
      # Keep the original web check name for Infra admission. Each of the five
      # browser shards is mandatory; file assignment uses measured spec durations.
      # New specs receive a fallback weight and are assigned automatically.
      - name: Browser journey, keyboard and mobile widths (shard 1/5)
        run: node scripts/run-browser-shard.mjs 1/5
      # Visual evidence is mandatory for PR review and failed browser jobs.
      # Infra rebuilds exact main SHA; successful main runs need no duplicate PNG archive.
      - name: Upload browser screenshots and lockfile
        if: ${{ always() && (github.event_name == 'pull_request' || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: star-adventures-react-visual-${{ github.sha }}
          path: |
            frontend/test-results/*.png
            frontend/package-lock.json
          if-no-files-found: warn
          retention-days: 7

  web-browser-rest:
    name: Remaining Chrome journeys (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report failures on every shard; do not cancel unrelated checks.
      fail-fast: false
      matrix:
        shard: [2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Verify runner-installed Chrome
        run: google-chrome --version
      - name: Browser journey, keyboard and mobile widths (shard ${{ matrix.shard }}/5)
        run: node scripts/run-browser-shard.mjs ${{ matrix.shard }}/5
      # Keep failed-shard diagnostics and PR screenshots, not five green-main archives.
      - name: Upload browser screenshots
        if: ${{ always() && (github.event_name == 'pull_request' || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: star-adventures-react-visual-part${{ matrix.shard }}-${{ github.sha }}
          path: frontend/test-results/*.png
          if-no-files-found: warn
          retention-days: 7

  infra-staging-notification:
    name: Request Infra-owned protected release candidate (no deploy)
    needs: [core, web, web-browser-rest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/star-adventures'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask Infra to build a protected ShadowOps ID candidate (never deploy)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SHADOWOPS_INFRA_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'STARADVS_PROTECTED_CANDIDATE_DISPATCH_NOT_CONFIGURED (manual Infra candidate build available)'
            exit 0
          fi
          # This only requests the trusted, non-deploying protected candidate
          # workflow. Infra independently checks exact green game main SHA
          # and assembles the fail-closed Identity Worker without Cloudflare credentials.
          if gh api --method POST \
              repos/evilsysadmin/shadowops-infra/actions/workflows/staradvs-protected-candidate.yml/dispatches \
              -f ref=main; then
            echo "STARADVS_PROTECTED_CANDIDATE_DISPATCH_ACCEPTED source_sha=$GITHUB_SHA deployment=not-attempted"
          else
            echo '::warning::Protected candidate dispatch unavailable; use Infra manual candidate builder'
          fi
