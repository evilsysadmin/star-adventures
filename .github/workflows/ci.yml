name: Star Adventures CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core rules and episode tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify rules, narrative and syntax
        run: npm run check

  web:
    name: React build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Verify runner-installed Chrome
        run: google-chrome --version
      - name: Tactical camera, grid and animation contracts
        run: npm run test:grid --prefix frontend
      - name: Typecheck and bundle
        run: npm run build --prefix frontend
      # Keep the original web check name for Infra admission. Each of the three
      # browser shards is mandatory; two shards exceeded the 15-minute job cap.
      - name: Browser journey, keyboard and mobile widths (shard 1/3)
        run: npm run test:e2e --prefix frontend -- --shard=1/3
      - name: Upload browser screenshots and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-adventures-react-visual-${{ github.sha }}
          path: |
            frontend/test-results/*.png
            frontend/package-lock.json
          if-no-files-found: warn
          retention-days: 7

  web-browser-rest:
    name: Remaining Chrome journeys (shard 2/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Verify runner-installed Chrome
        run: google-chrome --version
      - name: Browser journey, keyboard and mobile widths (shard 2/3)
        run: npm run test:e2e --prefix frontend -- --shard=2/3
      - name: Upload second-shard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-adventures-react-visual-part2-${{ github.sha }}
          path: frontend/test-results/*.png
          if-no-files-found: warn
          retention-days: 7

  web-browser-final:
    name: Remaining Chrome journeys (shard 3/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Verify runner-installed Chrome
        run: google-chrome --version
      - name: Browser journey, keyboard and mobile widths (shard 3/3)
        run: npm run test:e2e --prefix frontend -- --shard=3/3
      - name: Upload third-shard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-adventures-react-visual-part3-${{ github.sha }}
          path: frontend/test-results/*.png
          if-no-files-found: warn
          retention-days: 7

  infra-staging-notification:
    name: Request Infra-owned staging sync
    needs: [core, web, web-browser-rest, web-browser-final]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/star-adventures'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify ShadowOps Infra without publishing from game repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SHADOWOPS_INFRA_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'STARADVS_INFRA_DISPATCH_NOT_CONFIGURED (Infra scheduled fallback remains active)'
            exit 0
          fi
          # This only requests the trusted Infra workflow; that workflow
          # independently checks exact main SHA and successful source CI.
          if gh api --method POST \
              repos/evilsysadmin/shadowops-infra/actions/workflows/staradvs-pages-staging.yml/dispatches \
              -f ref=main; then
            echo "STARADVS_INFRA_DISPATCH_ACCEPTED source_sha=$GITHUB_SHA"
          else
            echo '::warning::ShadowOps Infra dispatch unavailable; Infra scheduled fallback remains active'
          fi
